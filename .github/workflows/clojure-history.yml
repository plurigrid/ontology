name: Clojure history walk

on:
  push:
    paths:
      - "deps.edn"
      - "src/**/*.clj"
      - "test/**/*.clj"
      - ".github/workflows/clojure-history.yml"
  pull_request:
    paths:
      - "deps.edn"
      - "src/**/*.clj"
      - "test/**/*.clj"
      - ".github/workflows/clojure-history.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Compile namespace
        run: clojure -M -e "(require 'plurigrid.ontology.history)"
      - name: Test
        run: clojure -M:test
